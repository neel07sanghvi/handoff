services:
  postgres:
    image: postgres:16-alpine
    container_name: handoff_postgres
    environment:
      POSTGRES_USER: handoff
      POSTGRES_PASSWORD: handoff
      POSTGRES_DB: handoff_dev
    ports:
      - "5432:5432"
    volumes:
      - handoff_postgres_data:/var/lib/postgresql/data

volumes:
  handoff_postgres_data: